# Camera: Intel's IPU3 3A (AE/AWB, noise reduction, sharpening from the
# Windows driver's tuning) instead of libcamera's own IPU3 IPA. libcamera
# searches this directory before its own. Installed by install-ipa.sh, in
# ~/.config/systemd/user/wireplumber.service.d/; undo: install-ipa.sh --uninstall.
[Service]
Environment=LIBCAMERA_IPA_MODULE_PATH=%h/.local/lib/libcamera-ipu3-intel
